name: iOS build (macOS)

on:
  workflow_dispatch:
    inputs:
      xbe_url:
        description: 'Optional private URL to default.xbe (SHA1 5bca1cf092edaadf876e8f80129900407a4a07b8) to build full recompiled game IPA'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'sdk/runtime/**'
      - 'sdk/cmake/**'
      - 'ios-app/**'
      - 'src/**'
      - 'CMakeLists.txt'
      - '.github/workflows/ios-build.yml'

permissions:
  contents: read

jobs:
  ios-app-host:
    name: Build unsigned iOS app IPA
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Check Apple build tools
        run: |
          xcodebuild -version
          cmake --version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Optional recompile from default.xbe
        env:
          XBE_URL_INPUT: ${{ github.event.inputs.xbe_url }}
          XBE_URL_SECRET: ${{ secrets.MC3_XBE_URL }}
        run: |
          URL="${XBE_URL_INPUT:-$XBE_URL_SECRET}"
          if [ -z "$URL" ]; then
            echo "No XBE URL provided; building stub mode."
            exit 0
          fi
          mkdir -p assets
          # Support standard Google Drive share URLs automatically
          if echo "$URL" | grep -qE 'drive\.google\.com/file/d/'; then
            GDRIVE_ID=$(echo "$URL" | sed -nE 's|.*drive\.google\.com/file/d/([^/?#]+).*|\1|p')
            URL="https://drive.usercontent.google.com/download?id=${GDRIVE_ID}&export=download&confirm=t"
          elif echo "$URL" | grep -qE 'drive\.google\.com.*[?&]id='; then
            GDRIVE_ID=$(echo "$URL" | sed -nE 's|.*[?&]id=([^&]+).*|\1|p')
            URL="https://drive.usercontent.google.com/download?id=${GDRIVE_ID}&export=download&confirm=t"
          fi
          curl -fSL "$URL" -o assets/default.xbe
          ACTUAL_SHA1=$(shasum -a 1 assets/default.xbe | awk '{print $1}')
          EXPECTED_SHA1="5bca1cf092edaadf876e8f80129900407a4a07b8"
          if [ "$ACTUAL_SHA1" != "$EXPECTED_SHA1" ]; then
            echo "SHA1 mismatch: got $ACTUAL_SHA1, expected $EXPECTED_SHA1"
            exit 1
          fi
          echo "Verified default.xbe ($ACTUAL_SHA1). Building xbe_recomp on macOS..."
          mkdir -p build-recomp-src
          cat > build-recomp-src/CMakeLists.txt << 'EOF'
          cmake_minimum_required(VERSION 3.25)
          project(xbe_recomp_host LANGUAGES C CXX)
          set(CMAKE_CXX_STANDARD 20)
          include(FetchContent)
          set(ZYDIS_BUILD_TOOLS OFF CACHE BOOL "" FORCE)
          set(ZYDIS_BUILD_EXAMPLES OFF CACHE BOOL "" FORCE)
          set(ZYDIS_BUILD_DOXYGEN OFF CACHE BOOL "" FORCE)
          FetchContent_Declare(zydis GIT_REPOSITORY https://github.com/zyantific/zydis.git GIT_TAG v4.1.1 GIT_SHALLOW TRUE)
          FetchContent_Declare(tomlplusplus GIT_REPOSITORY https://github.com/marzer/tomlplusplus.git GIT_TAG v3.4.0 GIT_SHALLOW TRUE)
          FetchContent_MakeAvailable(zydis tomlplusplus)
          file(GLOB RECOMP_SRCS "${CMAKE_CURRENT_LIST_DIR}/../sdk/tools/recomp/*.cpp")
          add_executable(xbe_recomp ${RECOMP_SRCS})
          target_include_directories(xbe_recomp PRIVATE "${CMAKE_CURRENT_LIST_DIR}/../sdk/runtime" "${CMAKE_CURRENT_LIST_DIR}/../sdk/tools/recomp")
          target_link_libraries(xbe_recomp PRIVATE Zydis tomlplusplus::tomlplusplus)
          EOF
          cmake -S build-recomp-src -B build-recomp-host -DCMAKE_BUILD_TYPE=Release
          cmake --build build-recomp-host --target xbe_recomp -j
          ./build-recomp-host/xbe_recomp config/game.toml --xdk sdk/xdk
          ls -la generated/game/

      - name: Configure iOS app target
        run: |
          cmake -S . -B build-ios-app -G Xcode \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DMC3_IOS_TARGET=ios-app

      - name: Build iOS app executable
        run: cmake --build build-ios-app --target MC3iOSApp --config Release 2>&1 | tail -100

      - name: Verify built app structure
        run: |
          APP_PATH="$(find build-ios-app -type d -name MC3iOSApp.app -print -quit)"
          test -n "$APP_PATH"
          test -x "$APP_PATH/MC3iOSApp"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleName' "$APP_PATH/Info.plist"
          file "$APP_PATH/MC3iOSApp"
          xcrun --sdk iphoneos vtool -show-build "$APP_PATH/MC3iOSApp"

      - name: Package unsigned IPA
        run: |
          APP_PATH="$(find build-ios-app -type d -name MC3iOSApp.app -print -quit)"
          test -n "$APP_PATH"

          IPA_ROOT="$RUNNER_TEMP/ipa-root"
          mkdir -p "$IPA_ROOT/Payload"
          ditto "$APP_PATH" "$IPA_ROOT/Payload/MC3iOSApp.app"

          cd "$IPA_ROOT"
          /usr/bin/zip -qry "$RUNNER_TEMP/MC3iOSApp-unsigned.ipa" Payload
          /usr/bin/unzip -l "$RUNNER_TEMP/MC3iOSApp-unsigned.ipa" | head -30
          test -s "$RUNNER_TEMP/MC3iOSApp-unsigned.ipa"

      - name: Upload unsigned iOS app IPA
        uses: actions/upload-artifact@v4
        with:
          name: MC3iOSApp-unsigned-IPA
          path: ${{ runner.temp }}/MC3iOSApp-unsigned.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Build summary
        if: always()
        run: |
          echo "## MC3 iOS Build" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$RUNNER_TEMP/MC3iOSApp-unsigned.ipa" ]; then
            echo "✅ IPA built successfully" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Build failed" >> "$GITHUB_STEP_SUMMARY"
          fi
